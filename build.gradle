plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'com.modrinth.minotaur' version "${minotaur_version}"
}

base {
	archivesName = project.archives_base_name
}

loom {
	mods {
		"throughput" {
			sourceSet sourceSets.main
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "throughput-gametest"
		enableGameTests = true
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Bundled inside our jar; falls back to vanilla permission levels when no permissions mod is installed.
	implementation include("me.lucko:fabric-permissions-api:${project.permissions_api_version}")

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
	from("THIRD_PARTY_NOTICES.md")
}

// GameTests always start from a fresh world, so results never depend on an earlier run.
def gameTestWorld = layout.buildDirectory.dir("run/gameTest/world")
tasks.named("runGameTest") {
	doFirst {
		gameTestWorld.get().asFile.deleteDir()
	}
}

// Publishing to Modrinth: MODRINTH_TOKEN must be set (the release workflow passes a repository secret).
// Release notes come from build/release-notes.md, which the workflow extracts from CHANGELOG.md.
modrinth {
	token = providers.environmentVariable("MODRINTH_TOKEN")
	projectId = "throughput"
	versionNumber = project.version
	versionName = "Throughput ${project.version}"
	versionType = project.version.contains("alpha") ? "alpha"
			: (project.version.contains("beta") || project.version.contains("rc")) ? "beta" : "release"
	uploadFile = tasks.jar
	gameVersions = [project.minecraft_version]
	loaders = ["fabric"]
	def notes = file("build/release-notes.md")
	changelog = notes.exists() ? notes.text : "See CHANGELOG.md"
	syncBodyFrom = file("branding/modrinth-description.md").text
	dependencies {
		required.project "fabric-api"
	}
}
